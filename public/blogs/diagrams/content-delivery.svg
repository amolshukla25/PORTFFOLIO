<svg xmlns="http://www.w3.org/2000/svg" width="960" height="300" viewBox="0 0 960 300" role="img" aria-labelledby="title desc"><title id="title">Content delivery and crawler discovery</title><desc id="desc">Typed lessons and markdown articles render to server HTML. The same content supplies sitemap URLs, structured data and llms.txt links, allowing visitors and crawlers to discover it.</desc><rect width="960" height="300" rx="24" fill="#0f172a"/><g font-family="sans-serif" fill="#f1f5f9"><text x="40" y="52" font-size="24" font-weight="700">One content source, multiple ways to discover it</text><g font-size="19" text-anchor="middle"><rect x="30" y="100" width="235" height="100" rx="12" fill="#1e40af"/><text x="147" y="141">Typed lessons</text><text x="147" y="171">Markdown articles</text><text x="296" y="157">→</text><rect x="330" y="100" width="250" height="100" rx="12" fill="#155e75"/><text x="455" y="141">Server-rendered</text><text x="455" y="171">readable HTML</text><text x="613" y="157">→</text><rect x="650" y="100" width="280" height="100" rx="12" fill="#1e40af"/><text x="790" y="132">Visitors and crawlers</text><text x="790" y="163">Sitemap · JSON-LD</text><text x="790" y="188">llms.txt links</text></g><text x="40" y="254" font-size="18" fill="#cbd5e1">Discoverable content is a prerequisite, not a ranking or traffic guarantee.</text></g></svg>