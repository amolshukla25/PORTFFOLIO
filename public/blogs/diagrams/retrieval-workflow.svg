<svg xmlns="http://www.w3.org/2000/svg" width="960" height="300" viewBox="0 0 960 300" role="img" aria-labelledby="title desc"><title id="title">Retrieval augmented generation workflow</title><desc id="desc">Documents are split into chunks and embedded into an index. A question retrieves relevant chunks. The model uses this context to write an answer with sources.</desc><rect width="960" height="300" rx="24" fill="#0f172a"/><g font-family="sans-serif" fill="#f1f5f9"><text x="40" y="52" font-size="24" font-weight="700">From source material to a grounded answer</text><g font-size="20" text-anchor="middle"><rect x="30" y="105" width="190" height="90" rx="12" fill="#1e40af"/><text x="125" y="143">Documents</text><text x="125" y="172">and chunks</text><rect x="265" y="105" width="190" height="90" rx="12" fill="#155e75"/><text x="360" y="143">Embeddings</text><text x="360" y="172">and index</text><rect x="500" y="105" width="190" height="90" rx="12" fill="#1e40af"/><text x="595" y="143">Retrieve</text><text x="595" y="172">with question</text><rect x="735" y="105" width="195" height="90" rx="12" fill="#155e75"/><text x="832" y="143">Model answer</text><text x="832" y="172">with sources</text><text x="242" y="157">→</text><text x="478" y="157">→</text><text x="713" y="157">→</text></g><text x="40" y="254" font-size="18" fill="#cbd5e1">Retrieval supplies evidence. It does not guarantee that the answer is correct.</text></g></svg>